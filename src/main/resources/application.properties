spring.application.name=banquito-switch-external-payments-service
server.port=${SERVER_PORT:8086}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SWITCH_PAGOS_EXTERNOS_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/init/001_create_external_payments_tables.sql

external.bank.client.mode=${EXTERNAL_BANK_CLIENT_MODE:mock}
external.bank.base-url=${EXTERNAL_BANK_BASE_URL:https://136.68.89.25.nip.io}
external.bank.token-path=${EXTERNAL_BANK_TOKEN_PATH:/api/b2b/v2/token}
external.bank.payment-path=${EXTERNAL_BANK_PAYMENT_PATH:/api/b2b/v2/interbank/payment}
external.bank.client-id=${EXTERNAL_BANK_CLIENT_ID:}
external.bank.client-secret=${EXTERNAL_BANK_CLIENT_SECRET:}
external.bank.connect-timeout-ms=${EXTERNAL_BANK_CONNECT_TIMEOUT_MS:5000}
external.bank.read-timeout-ms=${EXTERNAL_BANK_READ_TIMEOUT_MS:15000}
external.bank.insecure-ssl-enabled=${EXTERNAL_BANK_INSECURE_SSL_ENABLED:false}
external.bank.source-routing-code=${EXTERNAL_BANK_SOURCE_ROUTING_CODE:003}
external.bank.default-destination-routing-code=${EXTERNAL_BANK_DEFAULT_DESTINATION_ROUTING_CODE:001}
external.bank.destination-routing-code.30=${EXTERNAL_BANK_DESTINATION_ROUTING_CODE_30:001}
external.bank.destination-routing-code.32=${EXTERNAL_BANK_DESTINATION_ROUTING_CODE_32:001}
external.bank.destination-routing-code.35=${EXTERNAL_BANK_DESTINATION_ROUTING_CODE_35:001}
core.switch.default-accounting-date=${CORE_SWITCH_DEFAULT_ACCOUNTING_DATE:}

external.payment.poll.enabled=${EXTERNAL_PAYMENT_POLL_ENABLED:true}
external.payment.poll.initial-delay-ms=${EXTERNAL_PAYMENT_POLL_INITIAL_DELAY_MS:1000}
external.payment.poll.interval-ms=${EXTERNAL_PAYMENT_POLL_INTERVAL_MS:5000}
external.payment.poll.max-attempts=${EXTERNAL_PAYMENT_POLL_MAX_ATTEMPTS:5}

offus.core.mock.default-success=${OFFUS_CORE_MOCK_DEFAULT_SUCCESS:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

messaging.provider=${MESSAGING_PROVIDER:pubsub}
pubsub.enabled=${PUBSUB_ENABLED:true}
pubsub.project-id=${GOOGLE_CLOUD_PROJECT:}
pubsub.schema-version=${PUBSUB_SCHEMA_VERSION:1}
pubsub.topic.external-payment-results=${PUBSUB_TOPIC_EXTERNAL_PAYMENT_RESULTS:switch-external-payment-results}
pubsub.subscription.external-payments-off-us=${PUBSUB_SUB_EXTERNAL_PAYMENTS_OFF_US:switch-external-payments-off-us-sub}
