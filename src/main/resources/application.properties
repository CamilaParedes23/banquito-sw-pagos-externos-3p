spring.application.name=banquito-switch-external-payments-service
server.port=${SERVER_PORT:8086}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/init/001_create_external_payments_tables.sql

spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

rabbit.exchange.payment-lines=${RABBIT_EXCHANGE_PAYMENT_LINES:switch.payment.lines.direct}
rabbit.exchange.external-payments=${RABBIT_EXCHANGE_EXTERNAL_PAYMENTS:switch.external-payments.exchange}
rabbit.queue.external-payments.off-us=${RABBIT_QUEUE_EXTERNAL_PAYMENTS_OFF_US:switch.external-payments.off-us.queue}
rabbit.routing-key.off-us-completed=${RABBIT_ROUTING_KEY_OFF_US_COMPLETED:payment.line.off-us.completed}
rabbit.routing-key.off-us-failed=${RABBIT_ROUTING_KEY_OFF_US_FAILED:payment.line.off-us.failed}

external.payment.mock.origin-bank-code=${EXTERNAL_PAYMENT_MOCK_ORIGIN_BANK_CODE:BQTO}
external.payment.mock.timeout-ms=${EXTERNAL_PAYMENT_MOCK_TIMEOUT_MS:3000}
external.payment.poll.enabled=${EXTERNAL_PAYMENT_POLL_ENABLED:true}
external.payment.poll.initial-delay-ms=${EXTERNAL_PAYMENT_POLL_INITIAL_DELAY_MS:1000}
external.payment.poll.interval-ms=${EXTERNAL_PAYMENT_POLL_INTERVAL_MS:5000}
external.payment.poll.max-attempts=${EXTERNAL_PAYMENT_POLL_MAX_ATTEMPTS:5}

offus.core.mock.default-success=${OFFUS_CORE_MOCK_DEFAULT_SUCCESS:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

messaging.provider=${MESSAGING_PROVIDER}
pubsub.enabled=${PUBSUB_ENABLED}
pubsub.project-id=${GOOGLE_CLOUD_PROJECT:}
pubsub.schema-version=${PUBSUB_SCHEMA_VERSION:1}
pubsub.topic.external-payment-results=${PUBSUB_TOPIC_EXTERNAL_PAYMENT_RESULTS:switch-external-payment-results}
pubsub.subscription.external-payments-off-us=${PUBSUB_SUB_EXTERNAL_PAYMENTS_OFF_US:switch-external-payments-off-us-sub}
